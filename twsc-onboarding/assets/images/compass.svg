<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hand-drawn style compass icon for city exploration metaphor -->
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="48" fill="#FFF8E7" stroke="#3D5A80" stroke-width="2.5"/>
  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="2 4"/>
  <!-- Cardinal direction ticks -->
  <line x1="60" y1="16" x2="60" y2="24" stroke="#3D5A80" stroke-width="2.5"/>
  <line x1="60" y1="96" x2="60" y2="104" stroke="#3D5A80" stroke-width="2"/>
  <line x1="16" y1="60" x2="24" y2="60" stroke="#3D5A80" stroke-width="2"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#3D5A80" stroke-width="2"/>
  <!-- N/S/E/W labels -->
  <text x="60" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FF6B35">N</text>
  <text x="60" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D5A80">S</text>
  <text x="90" y="64" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D5A80">E</text>
  <text x="30" y="64" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D5A80">W</text>
  <!-- Compass needle - North (orange/warm) -->
  <polygon points="60,25 55,60 60,55 65,60" fill="#FF6B35" stroke="#3D5A80" stroke-width="1.5"/>
  <!-- Compass needle - South (teal) -->
  <polygon points="60,95 55,60 60,65 65,60" fill="#2EC4B6" stroke="#3D5A80" stroke-width="1.5"/>
  <!-- Center pivot -->
  <circle cx="60" cy="60" r="4" fill="#3D5A80"/>
  <circle cx="60" cy="60" r="2" fill="#FFF8E7"/>
</svg>
